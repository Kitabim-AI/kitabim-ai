services:
  # ─── PostgreSQL (Database) ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: kitabim-ai
      POSTGRES_USER: kitabim
      POSTGRES_PASSWORD: kitabim
    ports:
      - "5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitabim -d kitabim-ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis (Job Queue + Cache) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: kitabim-backend:local
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kitabim:kitabim@postgres:5432/kitabim-ai
      - REDIS_URL=redis://redis:6379/0
      - MEMGRAPH_URL=bolt://memgraph:7687
      - DATA_DIR=/app/data
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcs/key.json
      # Connection pool settings (loaded from .env but explicitly listed for visibility)
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-7}
    ports:
      - "30800:8000"
    volumes:
      - ./data:/app/data
      - ./gcs-key.json:/etc/gcs/key.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 300s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Worker (ARQ - always running) ───────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: kitabim-worker:local
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      ocr-service:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kitabim:kitabim@postgres:5432/kitabim-ai
      - REDIS_URL=redis://redis:6379/0
      - MEMGRAPH_URL=bolt://memgraph:7687
      - DATA_DIR=/app/data
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcs/key.json
      - OCR_SERVICE_URL=http://ocr-service:8000
      - OCR_SERVICE_TIMEOUT=${OCR_SERVICE_TIMEOUT:-60}
      # Connection pool settings (loaded from .env but explicitly listed for visibility)
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-7}
    volumes:
      - ./data:/app/data
      - ./gcs-key.json:/etc/gcs/key.json:ro
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Frontend (React/Vite served via Nginx) ───────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: kitabim-frontend:local
    restart: always
    ports:
      - "30080:80"
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Memgraph (Graph DB) ──────────────────────────────────────────────────
  memgraph:
    # NOTE: bind-mounting /var/lib/memgraph causes a segfault (mmap/AppArmor
    # interaction on bind-mounted paths). The knowledge graph is rebuilt from
    # PostgreSQL on demand, so ephemeral storage is acceptable here.
    image: memgraph/memgraph:3.10.1
    restart: always
    ports:
      - "37687:7687"
    healthcheck:
      # Use bash /dev/tcp to verify the Bolt port is accepting connections
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7687' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Memgraph Lab (Visualization UI) ──────────────────────────────────────
  memgraph-lab:
    image: memgraph/lab:latest
    restart: always
    ports:
      - "33000:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      memgraph:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Tesseract OCR Microservice ───────────────────────────────────────────
  ocr-service:
    build:
      context: services/ocr-service
      dockerfile: Dockerfile
    image: kitabim-ocr:local
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "38000:8000"
    environment:
      - OCR_NUM_THREADS=${OCR_NUM_THREADS:-8}
    # deploy:
    #   resources:
    #     limits:
    #       memory: 3.0G


volumes:
  postgres_data:
